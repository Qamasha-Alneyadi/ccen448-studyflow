<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyFlow · Task Manager</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#1c2541;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:#14244a;color:white;padding:18px max(24px,calc((100% - 960px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px;letter-spacing:-.8px}header small{color:#b9c9e7}.container{max-width:960px;margin:60px auto;padding:0 24px}.card{background:white;border:1px solid #e5eaf4;border-radius:18px;padding:32px;box-shadow:0 12px 35px #1e31500d}h1{margin:0 0 8px;font-size:30px}p{color:#65738d}.muted{color:#6c7890}input{width:100%;padding:14px;border:1px solid #cbd4e4;border-radius:10px;font:inherit;margin:8px 0 16px}button,.btn{background:#465bda;border:0;color:white;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer;text-decoration:none}button:hover{background:#3046c1}.link{color:#465bda;text-decoration:none}.alert{padding:12px;border-radius:9px;background:#fff0f0;color:#9c2e2e;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.row input{flex:1;margin:0}.task{padding:16px 0;border-bottom:1px solid #edf0f7;display:flex;justify-content:space-between;align-items:center;gap:12px}.task:last-child{border:0}.task.done span{text-decoration:line-through;color:#96a0b4}.task-actions{display:flex;gap:8px}.task-actions button{padding:8px 12px}.task-actions .delete{background:#f0f2f8;color:#7c4050}.stats{background:#eaf0ff;color:#344b9c;padding:10px 14px;border-radius:10px;display:inline-block;margin:18px 0}.logout{background:transparent;border:1px solid #8292b4;padding:8px 12px}footer{text-align:center;margin:30px;color:#8d99b0;font-size:13px}@media(max-width:600px){.container{margin:30px auto}.card{padding:22px}.task{align-items:flex-start}}
</style></head><body><header><div><strong>✦ StudyFlow</strong><br><small>Student task manager</small></div>{% if current_user.is_authenticated %}<form method="post" action="{{ url_for('logout') }}"><button class="logout">Log out</button></form>{% endif %}</header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>CCEN 448 · Dynamic website demonstration</footer></body></html>
